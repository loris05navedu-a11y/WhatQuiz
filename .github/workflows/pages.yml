name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sans variable API_URL, le site fonctionne seul : comptes et quiz dans le navigateur, parties en pair-à-pair.
      # Avec API_URL (adresse HTTPS d'un serveur WhatQuiz), le site utilise ce serveur.
      - name: Mode de publication
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::Site publié sans serveur (aucune variable API_URL)."
          else
            echo "::notice::Site relié au serveur $API_URL"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compiler le site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_STANDALONE: ${{ vars.API_URL == '' && 'true' || 'false' }}
        run: npm run build:client

      # GitHub Pages renvoie 404.html pour les liens profonds (/join, /dashboard…) : c'est le même fichier que l'accueil.
      - name: Liens profonds
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
